# logrotate 設定範本 — bcvnas-converter
#
# 安裝：
#   sudo cp scripts/logrotate.conf /etc/logrotate.d/video-converter
#   # 再將路徑替換為實際安裝目錄：
#   sudo sed -i 's|{{INSTALL_DIR}}|/opt/video-converter|g' /etc/logrotate.d/video-converter
#
# 注意：daemon 已內建 RotatingFileHandler（依 LOG_MAX_BYTES / LOG_BACKUP_COUNT 設定）。
# 若同時啟用 logrotate，建議將 LOG_MAX_BYTES 設為 0（停用 Python 層輪替）
# 以避免兩套機制同時輪替造成的競爭。

{{INSTALL_DIR}}/log/scanner.log
{{INSTALL_DIR}}/log/scanner_error.log
{{INSTALL_DIR}}/log/processor.log
{{INSTALL_DIR}}/log/processor_error.log
{{INSTALL_DIR}}/log/api.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    # RotatingFileHandler 自行輪替，logrotate 需用 copytruncate 截斷原檔
    # 或設 LOG_MAX_BYTES=0 停用 Python 層輪替後改用 postrotate 發 SIGHUP
    copytruncate
}
